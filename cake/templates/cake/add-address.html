
{% extends 'base.html' %} 

{% block section %}

<div class="container mt-5 mb-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow p-4">
        <h2 class="mb-4 text-center">Add Delivery Address</h2>
        <form method="POST">
          {% csrf_token %}
          <div class="mb-3"><label class="form-label"> House Number / Building Name </label>{{ form.house_num_or_building_name }}</div>
          <div class="mb-3"><label class="form-label"> Landmark </label>{{ form.landmark }}</div>
          <div class="mb-3"><label class="form-label"> Place </label> {{ form.place }}</div>
          <div class="mb-3"><label class="form-label"> Pincode </label>{{ form.pincode }}</div>
          <button type="submit" class="btn btn-primary w-100">Save Address</button>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
